
name: Build Adventure World 3D APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    container:
      image: barichello/godot-ci:4.3

    env:
      HOME: /root
      ANDROID_HOME: /usr/lib/android-sdk
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Check Android Setup
        run: |
          echo "Checking Java..."
          java -version

          echo "Checking Android SDK..."
          ls "$ANDROID_HOME/build-tools/34.0.0"

          echo "Checking Android Platform..."
          ls "$ANDROID_HOME/platforms/android-34"

          echo "Checking Debug Keystore..."
          test -f /root/debug.keystore

          echo "Checking Godot Templates..."
          ls /root/.local/share/godot/export_templates/4.3.stable/

      - name: Import Game
        run: |
          godot --headless --editor \
            --path . --quit --verbose

      - name: Export Android APK
        run: |
          mkdir -p build

          godot --headless --verbose \
            --path . \
            --export-debug "Android" \
            build/AdventureWorld3D.apk

          test -s build/AdventureWorld3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Adventure-World-3D-APK
          path: build/AdventureWorld3D.apk
          if-no-files-found: error
